[project]
name = "audiblez"
version = "0.5.0"
description = "Generate audiobooks from EPUB e-books using Kokoro speech synthesis"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
authors = [
    { name = "runlevel6" }
]
keywords = ["audiobook", "epub", "text-to-speech", "kokoro", "m4b"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "beautifulsoup4>=4.12,<5.0",
    "ebooklib>=0.18,<0.19",
    "kokoro==0.9.4",
    "lxml>=4.9,<6.0",
    "misaki[zh]>=0.9.2",
    "numpy>=1.24,<3.0",
    "phonemizer>=3.2,<4.0",
    "pick>=2.4,<3.0",
    "soundfile>=0.13.1,<0.14.0",
    "spacy>=3.8,<4.0",
    "tabulate>=0.9,<0.10",
    "torch>=2.0",
]

[project.optional-dependencies]
gui = [
    "pillow>=10.0",
    "wxpython>=4.2.1",
]
dev = [
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/runlevel6/audiblez"
Repository = "https://github.com/runlevel6/audiblez"
Issues = "https://github.com/runlevel6/audiblez/issues"
Original = "https://github.com/santinic/audiblez"

[project.scripts]
audiblez = "audiblez.cli:cli_main"
audiblez-ui = "audiblez.ui:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["audiblez*"]
